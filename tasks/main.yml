---
- name: 'Include OS specific vars'
  ansible.builtin.include_vars: "{{ lookup('first_found', role_vars_files) }}"
  vars:
    role_vars_files:
      files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - 'vars'

- name: 'Ensure Keycloak installed'
  ansible.builtin.include_tasks: "tasks/install_{{ keycloak_install_method }}.yml"

- name: 'Ensure Keycloak reverse proxy configured'
  ansible.builtin.include_tasks: 'tasks/install_reverse_proxy.yml'

- name: 'Configure realms'
  ansible.builtin.include_tasks: 'tasks/realms_federation.yml'
